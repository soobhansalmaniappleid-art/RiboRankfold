[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riborank"
version = "0.1.0"
description = "Evaluation harness for ranking RNA 3D structure candidates, plus a staged discovery engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = [
    "riborank",
    "discovery",
    "discovery.features",
    "discovery.agents",
    "sde",
    "sde.tools",
    "sde.benchmarks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
